name: Game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-gate:
    name: Headless gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7-stable
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ensure python3 is available to Bash and fake Godot fixtures
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            shim_dir="$RUNNER_TEMP/packet-trail-bin"
            mkdir -p "$shim_dir"
            python_path="$(command -v python)"
            printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$python_path" > "$shim_dir/python3"
            chmod +x "$shim_dir/python3"
            printf '%s\n' "$shim_dir" >> "$GITHUB_PATH"
            export PATH="$shim_dir:$PATH"
          fi
          python3 --version

      - name: Download official Godot and verify the SHA512 manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import platform
          import urllib.request
          import zipfile

          version = os.environ["GODOT_VERSION"]
          platform_asset = {
              "Linux": "linux.x86_64",
              "Darwin": "macos.universal",
              "Windows": "win64.exe",
          }[platform.system()]
          asset = f"Godot_v{version}_{platform_asset}.zip"
          base = f"https://github.com/godotengine/godot-builds/releases/download/{version}/"
          destination = Path(os.environ["RUNNER_TEMP"]) / "packet-trail-godot"
          destination.mkdir(parents=True, exist_ok=True)

          with urllib.request.urlopen(base + "SHA512-SUMS.txt", timeout=60) as response:
              manifest = response.read()
          # Pin the official 4.7-stable manifest as retrieved on 2026-11-05.
          manifest_sha256 = "82cc4e8563f0e6edcbe1b79d1352afc441ce98e8b322b443c0e0d2717096c425"
          if hashlib.sha256(manifest).hexdigest() != manifest_sha256:
              raise SystemExit("Godot checksum manifest changed")
          entries = [line.split() for line in manifest.decode("utf-8").splitlines()]
          expected = [parts[0] for parts in entries
                      if len(parts) == 2 and parts[1].lstrip("*") == asset]
          if len(expected) != 1 or len(expected[0]) != 128:
              raise SystemExit("Missing or ambiguous Godot SHA512 entry")

          archive = destination / asset
          urllib.request.urlretrieve(base + asset, archive)
          with archive.open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha512").hexdigest()
          if actual != expected[0]:
              raise SystemExit("Godot archive SHA512 mismatch")
          with zipfile.ZipFile(archive) as package:
              package.extractall(destination)
          executable = {
              "Linux": destination / f"Godot_v{version}_linux.x86_64",
              "Darwin": destination / "Godot.app/Contents/MacOS/Godot",
              "Windows": destination / f"Godot_v{version}_win64_console.exe",
          }[platform.system()]
          if not executable.is_file():
              raise SystemExit(f"Godot executable missing: {executable}")
          executable.chmod(executable.stat().st_mode | 0o111)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"GODOT_BIN={executable.as_posix()}\n")
          print(f"Verified official archive: {asset}")
          PY

      - name: Run complete headless game, campaign, presentation, locale, and boundary gate
        run: |
          "$GODOT_BIN" --version
          bash tools/gate.sh

      - name: Check the standard-library package helper
        run: python3 tools/package_game.py --self-test

      - name: Export the native resource pack and inspect the actual packed campaigns
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          root = Path.cwd()
          artifacts = root / ".omx/artifacts/pck-ci"
          artifacts.mkdir(parents=True, exist_ok=True)
          preset = {"Linux": "Linux", "macOS": "macOS", "Windows": "Windows"}[os.environ["RUNNER_OS"]]
          binary = os.environ["GODOT_BIN"]

          def run(label, args):
              try:
                  result = subprocess.run([binary, "--headless", *args], capture_output=True, text=True,
                                          encoding="utf-8", errors="replace", timeout=240)
                  log = result.stdout + result.stderr
              except subprocess.TimeoutExpired as error:
                  partial = error.stdout or b""
                  log = partial.decode("utf-8", errors="replace") if isinstance(partial, bytes) else partial
                  (artifacts / (label + ".log")).write_text(log, encoding="utf-8")
                  raise SystemExit(label + " timed out; pack verification is not skipped")
              (artifacts / (label + ".log")).write_text(log, encoding="utf-8")
              print(log)
              if result.returncode or re.search(r"(^|\s)(SCRIPT ERROR:|Parse Error:|ERROR:)", log):
                  raise SystemExit(label + " failed")
              return log

          # --export-pack uses save_pack directly; native executable templates are not required.
          with tempfile.TemporaryDirectory(prefix="packet-trail-pck-", dir=os.environ["RUNNER_TEMP"]) as work:
              work = Path(work)
              pack = work / "MidnightAccess.pck"
              run("export", ["--path", (root / "godot").as_posix(), "--export-pack", preset, pack.as_posix()])
              if not pack.is_file() or pack.stat().st_size <= 0:
                  raise SystemExit("Native pack was not exported")
              isolated = work / "isolated"
              isolated.mkdir()
              (isolated / "project.godot").write_text('config_version=5\n[application]\nconfig/name="Pack inspection"\n', encoding="utf-8")
              log = run("inspection", ["--path", isolated.as_posix(), "--script",
                                       (root / "godot/tools/inspect_package.gd").as_posix(), "--", pack.as_posix()])
              reports = []
              for line in log.splitlines():
                  try:
                      report = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(report, dict) and report.get("suite") == "packed_perspectives":
                      reports.append(report)
              if (len(reports) != 1 or type(reports[0].get("checks")) is not int
                      or reports[0]["checks"] <= 0 or reports[0].get("failures") != []):
                  raise SystemExit("Missing or unsuccessful packed_perspectives report")
              if (reports[0].get("actual_public_counts") != {"intruder": 28, "defender": 8, "tracker": 8, "challenge": 3}
                      or reports[0].get("original_case_count") != 44
                      or reports[0].get("challenge_case_count") != 3
                      or reports[0].get("legacy_case_count") != 28
                      or reports[0].get("commission_case_count") != 2):
                  raise SystemExit("Packed scope must preserve main47 and legacy28 with two separately optional commissions")
              with pack.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              evidence = {"preset": preset, "sha256": digest, "bytes": pack.stat().st_size,
                          "report": reports[0], "scope": "actual exported PCK; native executable and GUI acceptance are separate"}
              (artifacts / "report.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Exported resource pack: PASS\n\n```json\n" + json.dumps(evidence, indent=2) + "\n```\n")
          PY

      - name: Linux partial UI smoke (M01 of 47 and four campaign selections) with installed Xvfb and Mesa
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import struct
          import subprocess
          import tempfile

          artifacts = Path(".omx/artifacts/ci-render")
          artifacts.mkdir(parents=True, exist_ok=True)

          def summary(message):
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write(message + "\n\n")

          prerequisites = [tool for tool in ("xvfb-run", "Xvfb", "xauth") if not shutil.which(tool)]
          if prerequisites:
              summary("Linux Xvfb/Mesa source render: **NOT_RUN**; installed tools missing: " + ", ".join(prerequisites))
              raise SystemExit(0)

          base = ["xvfb-run", "--auto-servernum", "--server-args=-screen 0 1600x900x24",
                  os.environ["GODOT_BIN"], "--display-driver", "x11", "--audio-driver", "Dummy",
                  "--rendering-method", "gl_compatibility", "--rendering-driver", "opengl3"]
          with tempfile.TemporaryDirectory(prefix="packet-trail-render-probe-") as directory:
              probe = Path(directory)
              (probe / "project.godot").write_text(
                  'config_version=5\n[application]\nconfig/name="PacketTrailRendererProbe"\nrun/main_scene="res://probe.tscn"\n',
                  encoding="utf-8")
              (probe / "probe.tscn").write_text(
                  '[gd_scene format=3]\n[node name="Probe" type="Node3D"]\n[node name="Camera" type="Camera3D" parent="."]\ncurrent=true\n',
                  encoding="utf-8")
              try:
                  result = subprocess.run(base + ["--path", str(probe), "--quit-after", "3"],
                                          capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=45)
              except subprocess.TimeoutExpired:
                  summary("Linux Xvfb/Mesa source render: **NOT_RUN**; empty renderer preflight timed out.")
                  raise SystemExit(0)
          probe_log = result.stdout + result.stderr
          (artifacts / "renderer-probe.log").write_text(probe_log, encoding="utf-8")
          renderer = [line for line in probe_log.splitlines() if "OpenGL API" in line]
          if result.returncode or not renderer or not re.search(r"llvmpipe|softpipe", probe_log, re.I):
              summary("Linux Xvfb/Mesa source render: **NOT_RUN**; no successful software OpenGL preflight.\n```text\n" + probe_log[-5000:] + "\n```")
              raise SystemExit(0)

          render_profile = "ci-render-smoke"
          timeout_seconds = 300  # Harness watchdog is 240 seconds; leave time for its failure report.
          try:
              result = subprocess.run(base + ["--path", "godot", "--script", "res://tools/capture_perspectives.gd",
                                              "--", "--ci-render-smoke"],
                                      capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=timeout_seconds)
          except subprocess.TimeoutExpired as error:
              partial = error.stdout or b""
              partial = partial.decode("utf-8", errors="replace") if isinstance(partial, bytes) else partial
              (artifacts / "ci-render-smoke.log").write_text(partial, encoding="utf-8")
              summary(f"Linux partial UI smoke ({render_profile}, M01/47): **FAIL** ({timeout_seconds}-second external timeout).\n```text\n" + partial[-14000:] + "\n```")
              raise SystemExit(1)
          log = result.stdout + result.stderr
          (artifacts / "ci-render-smoke.log").write_text(log, encoding="utf-8")
          summary(f"Linux partial UI smoke execution log ({render_profile}; virtual X11, source scene, Dummy audio; not full-campaign or physical GUI/audio acceptance):\n```text\n" + log[-14000:] + "\n```")
          reports = []
          for line in log.splitlines():
              try:
                  report = json.loads(line)
              except ValueError:
                  continue
              if isinstance(report, dict) and report.get("suite") == "rendered_perspectives":
                  reports.append(report)
          if result.returncode or re.search(r"(^|\s)(SCRIPT ERROR:|Parse Error:|ERROR:)", log):
              raise SystemExit("Source renderer or integration failed; inspect the execution log above")
          if "OpenGL API" not in log or not re.search(r"llvmpipe|softpipe", log, re.I):
              raise SystemExit("Full source capture did not identify the software OpenGL renderer")
          if (len(reports) != 1 or type(reports[0].get("checks")) is not int
                  or reports[0]["checks"] <= 0 or reports[0].get("failures") != []):
              raise SystemExit("Missing or unsuccessful rendered_perspectives report")
          report = reports[0]
          scope = report.get("expected_scope", {})
          cases = report.get("campaign_cases", [])
          not_run = report.get("not_run", [])
          if (report.get("profile") != render_profile or not isinstance(scope, dict)
                  or any(type(scope.get(key)) is not int or scope[key] != value
                         for key, value in {"cases": 1, "original_cases": 1, "challenge_cases": 0, "endings": 0, "packs_selected": 4}.items())
                  or scope.get("case_counts") != {"intruder": 1, "defender": 0, "tracker": 0, "challenge": 0}
                  or scope.get("locales") != ["ko", "en", "ja", "zh_Hans", "es", "de"]
                  or report.get("selected_packs") != ["intruder", "defender", "tracker", "challenge"]
                  or type(report.get("actual_case_count")) is not int or report["actual_case_count"] != 1
                  or type(report.get("actual_ending_count")) is not int or report["actual_ending_count"] != 0
                  or type(report.get("original_case_count")) is not int or report["original_case_count"] != 1
                  or type(report.get("challenge_case_count")) is not int or report["challenge_case_count"] != 0
                  or report.get("pack_endings") != []
                  or report.get("protected_files_unchanged") is not True
                  or report.get("legacy_source_probe", {}).get("legacy_sources_checked") is not False
                  or not isinstance(cases, list) or len(cases) != 1 or not isinstance(cases[0], dict)
                  or cases[0].get("pack_id") != "intruder" or cases[0].get("mission_id") != "M01"
                  or cases[0].get("completed") is not True
                  or not isinstance(not_run, list) or not not_run
                  or any(not isinstance(item, str) or not item.strip() for item in not_run)):
              raise SystemExit("Missing or mismatched ci-render-smoke coverage report")
          forms = report.get("first_case_form_views", [])
          if not isinstance(forms, list) or len(forms) != 3 or any(not isinstance(item, dict) for item in forms):
              raise SystemExit("Malformed campaign form coverage")
          forms = {item.get("pack_id"): item for item in forms}
          for pack, mission, kind, action, fields in [
              ("defender", "D01", "response_lab", "set_control", {"control_id", "value"}),
              ("tracker", "T01", "observation_case", "collect", {"sensor_id"}),
              ("challenge", "X01", "response_lab", "set_control", {"control_id", "value"}),
          ]:
              form = forms.get(pack, {})
              if (form.get("mission_id") != mission or form.get("kind") != kind or form.get("action") != action
                      or form.get("model_run") is not False or not isinstance(form.get("typed_widgets"), dict)
                      or not fields.issubset(form["typed_widgets"])):
                  raise SystemExit("Missing actual structured form preview for " + pack)
          captures = report.get("captures", [])
          metrics = report.get("capture_metrics", [])
          if not captures or len(metrics) != len(captures):
              raise SystemExit("Missing captured PNG metrics")
          rows = ["| PNG | Pixels | Sample luminance min/max | SHA256 |", "|---|---|---|---|"]
          for path, metric in zip(captures, metrics):
              file = Path(path)
              with file.open("rb") as stream:
                  header = stream.read(24)
                  stream.seek(0)
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if header[:8] != b"\x89PNG\r\n\x1a\n" or len(header) != 24:
                  raise SystemExit("Invalid captured PNG")
              width, height = struct.unpack(">II", header[16:24])
              low, high = metric.get("min_sample_luminance"), metric.get("max_sample_luminance")
              if (metric.get("path") != path or metric.get("width") != width or metric.get("height") != height
                      or metric.get("sha256") != digest or not (width > 0 and height > 0)
                      or type(low) not in (int, float) or type(high) not in (int, float)
                      or not (0 <= low < high <= 1 and high - low > 0.005)):
                  raise SystemExit("Captured PNG metrics or hash verification failed")
              rows.append(f"| {file.name} | {width}×{height} | {low:.5f}/{high:.5f} | `{digest}` |")
          summary(f"Linux Xvfb/Mesa **partial UI smoke PASS** — profile `{render_profile}`, {len(cases)}/47 public campaign cases (M01).\n\n"
                  + "Coverage: actual original M01 completion/input, four independent campaign selections, D01/T01/X01 structured form previews without challenge model execution, four terminals, pause, room, six locales, PNG metrics and protected-file preservation.\n\n"
                  + "Remaining 43 original cases and all three challenge case completions, new-model execution and four ending GUIs are NOT_RUN in this profile. Preserved original44/88-route plus challenge3/6-route headless validation and legacy tests remain separate evidence; the local macOS full GUI suite is also separate.\n\n"
                  + "Reported limitations:\n" + "\n".join("- " + item for item in not_run)
                  + "\n\n" + "\n".join(renderer) + "\n\n" + "\n".join(rows)
                  + "\n\nPNG binaries are not uploaded: only these metrics, hashes and execution logs persist in the job summary.")
          PY

      - name: Keep unexecuted renderer acceptance explicit
        if: always()
        run: |
          python3 - <<'PY'
          import os
          platform = os.environ["RUNNER_OS"]
          message = {
              "Windows": "Windows native Compatibility/D3D12-WARP pixel/input acceptance: NOT_RUN. Headless gate does not prove it; WARP availability is not established and D3D12 is a different renderer from shipping OpenGL Compatibility.",
              "macOS": "macOS hosted-runner native pixel/input acceptance: NOT_RUN. The headless gate is separate from local macOS native captures.",
              "Linux": "Linux virtual-X11 source render is reported in its separate step. Physical Linux hardware, audio hearing, device IME and packaged-app GUI acceptance remain NOT_RUN.",
          }[platform]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(message + "\n")
          print(message)
          PY
