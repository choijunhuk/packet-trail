; Native packaging presets. Exporting and GUI acceptance are separate checks.
; macOS uses the macOS native ad-hoc signer, without notarization credentials.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/ui/strings_ko.json,assets/ui/strings_en.json,assets/ui/desktop/SOURCE.md,data/missions/*.json,data/campaign/campaign.json,data/campaign/legacy_v1.json,data/campaign/packs/*.json,locales/*.po,assets/fonts/OFL*.txt,assets/fonts/SOURCE*.json,assets/fonts/METADATA*.pb,assets/audio/LICENSE.txt,assets/audio/manifest.json,assets/portraits/SOURCE.json,LICENSE-Godot.txt,THIRD-PARTY-LICENSES.json"
exclude_filter="tests/*,tools/*,locales/*.json,data/campaign/locales/*,data/campaign/content_inventory.json,data/campaign/locale_revision.json,*solutions*.json"
export_path="../builds/1.2.1-rc1/macos/MidnightAccess.app"

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.choijunhuk.midnightaccess"
application/short_version="1.2.0"
application/version="1.2.0"
codesign/codesign=3
codesign/identity="-"
codesign/entitlements/disable_library_validation=true
notarization/notarization=0

