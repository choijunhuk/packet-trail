; Native packaging presets. Exporting and GUI acceptance are separate checks.
; macOS uses the macOS native ad-hoc signer, without notarization credentials.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json,assets/fonts/OFL.txt,assets/fonts/SOURCE.json,LICENSE-Godot.txt,THIRD-PARTY-LICENSES.json"
exclude_filter="tests/*,tools/*"
export_path="../builds/macos/MidnightAccess.zip"

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.choijunhuk.midnightaccess"
application/short_version="0.1.0"
application/version="0.1.0"
codesign/codesign=3
codesign/identity="-"
codesign/entitlements/disable_library_validation=true
notarization/notarization=0

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json,assets/fonts/OFL.txt,assets/fonts/SOURCE.json,LICENSE-Godot.txt,THIRD-PARTY-LICENSES.json"
exclude_filter="tests/*,tools/*"
export_path="../builds/windows/MidnightAccess.exe"

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/product_name="심야접속"

[preset.2]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json,assets/fonts/OFL.txt,assets/fonts/SOURCE.json,LICENSE-Godot.txt,THIRD-PARTY-LICENSES.json"
exclude_filter="tests/*,tools/*"
export_path="../builds/linux/MidnightAccess.x86_64"

[preset.2.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
